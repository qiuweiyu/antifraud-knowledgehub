name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: antifraud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d antifraud_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AFKH_REDIS_INTEGRATION_ADDR: 127.0.0.1:6379
      AFKH_POSTGRES_INTEGRATION_DSN: host=127.0.0.1 user=postgres password=postgres dbname=antifraud_test port=5432 sslmode=disable TimeZone=UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build
